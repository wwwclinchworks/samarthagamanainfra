    <polygon points="66,58 66,0 80,10 80,68" fill="#1F1F1F"/>
    <polygon points="48,10 66,0 80,10 62,20" fill="#E0C07A"/>
    <!-- mid-right -->
    <polygon points="70,70 70,22 84,14 84,62" fill="#B89050"/>
    <polygon points="84,62 84,14 96,22 96,70" fill="#2A2A2A"/>
    <polygon points="70,22 84,14 96,22 82,30" fill="#C59C5E"/>
