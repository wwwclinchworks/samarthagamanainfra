  <path d="M50 180C66 168 70 152 66 138c-6-22 18-34 40-42 14-5 28-4 40 2" stroke="#2A2A2A" stroke-width="9" stroke-linecap="round"/>
  <path d="M46 178C62 166 66 150 62 136c-6-22 18-34 40-42 14-5 28-4 40 2" stroke="#0B0E13" stroke-width="1.6" stroke-linecap="round"/>
