    <polygon points="8,78 8,48 22,40 22,70" fill="#C59C5E"/>
    <polygon points="22,70 22,40 34,48 34,78" fill="#2C2C2C"/>
    <polygon points="8,48 22,40 34,48 20,56" fill="#A8884A"/>
